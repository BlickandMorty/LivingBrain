[package]
name = "livingbrain"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Experimental software-memory utilities for decay, reinforcement, text heuristics, and caching"
repository = "https://github.com/BlickandMorty/LivingBrain"
keywords = ["ai", "memory", "agents", "knowledge-graph", "llm"]
categories = ["science", "data-structures"]
readme = "README.md"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = { version = "2.6", features = ["unicode"] }
thiserror = "2.0"

# Optional: full-text search for Warm layer
tantivy = { version = "0.22", optional = true }

# Optional: git-backed vault mutations
git2 = { version = "0.19", default-features = false, optional = true }

[features]
default = ["tantivy"]
git = ["dep:git2"]

[dev-dependencies]
tempfile = "3.14"
tokio = { version = "1", features = ["rt", "macros"] }
